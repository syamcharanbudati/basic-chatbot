<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CHARAN AI Chatbot</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="chat-container">


        <!-- Header -->

        <div class="chat-header">

            <div class="bot-avatar">
                🤖
            </div>

            <div>

                <h2>CHARAN AI Chatbot</h2>

                <p>Online</p>

            </div>

        </div>



        <!-- Chat messages -->

        <div id="chat-box"
             class="chat-box">


            <!-- First bot message -->

            <div class="message bot-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="message-text">

                    Hello! 👋

                    <br><br>

                    I am your chatbot.

                    <br>

                    Type something below!

                </div>

            </div>

        </div>



        <!-- Input area -->

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
            >

            <button onclick="sendMessage()">

                Send

            </button>

        </div>


    </div>



    <script src="script.js"></script>

</body>

</html>
